[package]
name = "gamrs"
version = "0.14.6"
edition = "2021"
description = "Generalised Additive Models in Rust — 10 families, multi-smooth (y ~ s(x0) + s(x1)), tensor products te(x0, x1), Python bindings via PyO3."
license = "MIT"
readme = "README.md"
repository = "https://github.com/AlekJaworski/gamrs"
keywords = ["statistics", "regression", "gam", "smoothing", "mgcv"]
categories = ["science", "mathematics"]

[lib]
name = "gamrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.16"
thiserror = "2.0"
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
bincode = { version = "1.3", optional = true }

# ndarray-linalg gated behind `blas` so the BLAS backend (system OpenBLAS,
# static OpenBLAS, or Intel MKL) is selected explicitly per platform. See
# the [features] block below and .github/workflows/release.yml for the
# per-OS recipe.
[dependencies.ndarray-linalg]
version = "0.17"
optional = true
default-features = false

# Pulled directly (alongside ndarray-linalg → lax → openblas-src) for two
# reasons: (1) lax requests openblas-src with `default-features = false`, but
# openblas-src 0.10.16 made its HTTPS source-fetcher require a TLS feature —
# re-enable `rustls` here or openblas-build fails to compile; (2) 0.10.16
# honours `OPENBLAS_DYNAMIC_ARCH=1` (set in release.yml), which builds a
# runtime-CPU-dispatched OpenBLAS. Without it the static wheel bakes the CI
# runner's CPU (AVX-512) and SIGILLs on AVX2-only hosts (the 0.11.x wheel
# bug). Only relevant to the openblas backends, not MKL (Windows).
[dependencies.openblas-src]
version = "0.10.16"
optional = true
default-features = false
features = ["rustls"]

[features]
# Default features set for dev ergonomics. `cargo check`, `cargo clippy`,
# and `maturin develop` (all without --features) exercise every cfg path
# and link the system OpenBLAS that the dev box already has installed.
#
# Release wheel pipelines (.github/workflows/release.yml) MUST pass
# `--no-default-features` and pick the platform-correct static backend
# explicitly: `blas-system` (Linux apt openblas), `blas-static` (macOS
# brew openblas + delocate), `blas-mkl-static` (Windows — avoids Fortran
# toolchain). Defaults + a wheel's explicit static feature would union
# into double-linked OpenBLAS and break the build.
default = ["persistence", "blas", "blas-system"]
python = ["dep:pyo3", "dep:numpy", "persistence"]
persistence = ["dep:serde", "dep:serde_json", "dep:bincode", "ndarray/serde"]
# Phase-level wall-clock timers in hot paths. Off by default — zero
# overhead when the feature is disabled (each `profile::scoped(...)`
# becomes a zero-sized type whose Drop is a no-op).
profile = []
# BLAS features — pick exactly one of blas-system / blas-static / blas-mkl-static.
# `ndarray/blas` routes `Array2::dot()` through the chosen BLAS backend; without
# it, ndarray-linalg's BLAS hookup only accelerates linalg routines
# (`Cholesky::cholesky`, `Solve::solve`, etc.) and leaves plain `.dot()` on the
# pure-Rust path. mgcv_rust's perf gap on scat at v0.10 was traceable here.
blas = ["dep:ndarray-linalg", "ndarray/blas"]
# openblas backends pull openblas-src directly too (see [dependencies.openblas-src]
# above) to enable `rustls` + the OPENBLAS_DYNAMIC_ARCH build. MKL doesn't use it.
blas-system = ["ndarray-linalg/openblas-system", "dep:openblas-src"]   # Linux dev box + manylinux wheel
blas-static = ["ndarray-linalg/openblas-static", "dep:openblas-src"]   # static OpenBLAS wheel
blas-mkl-static = ["ndarray-linalg/intel-mkl-static"]                  # Windows wheel

[dev-dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "bench_gaussian"
path = "benches/bench_gaussian.rs"
harness = false

[[bench]]
name = "bench_baseline"
path = "benches/bench_baseline.rs"
harness = false

[[bench]]
name = "bench_multi_smooth"
path = "benches/bench_multi_smooth.rs"
harness = false

[[bench]]
name = "bench_design_prepare"
path = "benches/bench_design_prepare.rs"
harness = false

[[bench]]
name = "bench_10d_gaussian"
path = "benches/bench_10d_gaussian.rs"
harness = false

[[bench]]
name = "bench_10d_gaussian_profile"
path = "benches/bench_10d_gaussian_profile.rs"
harness = false

[[bench]]
name = "bench_nb"
path = "benches/bench_nb.rs"
harness = false

[[bench]]
name = "bench_scat_profile"
path = "benches/bench_scat_profile.rs"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `unwind` (NOT `abort`) is load-bearing for the Python wheel: wheels build
# with `--release`, and PyO3 wraps every `#[pyfunction]`/`#[pymethods]` body
# in `catch_unwind`, converting a Rust panic into a catchable Python
# `PanicException`. Under `panic = "abort"` there is no unwinding, so any
# panic (a stray `.unwrap()` on a singular system, an arithmetic overflow,
# an out-of-bounds slice) SIGABRTs the user's interpreter instead of raising.
# For a library loaded into a host process that is the wrong failure mode.
# The unwind-table cost is negligible for a numerical crate (panics are off
# the hot path), and `cargo test` already runs unwind, so this also makes the
# release-profile test runs behave like the wheel.
panic = "unwind"
strip = true

# Release-quality runtime with ~3-4× faster compile vs `release`.
# Use for development iteration; keep `release` for CI / publishes.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Profiling profile — release-tier optimizations + line-table debug info
# so samply / perf can resolve function names. Use for cargo
# flamegraph / samply record runs.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.dev]
opt-level = 1

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - name: Build host CPU (the wheel's contents depend on it)
        # Two release runs 18 minutes apart, same commit config and the same
        # manylinux image digest, produced wheels with 0 and with many AVX-512
        # instructions respectively (runs 32381555130 and 32383338377). The only
        # uncontrolled input left is this runner's CPU: OpenBLAS's DYNAMIC_ARCH
        # core list is decided by a build-time probe, so an AVX-512 build host
        # compiles SKYLAKEX kernels in and a non-AVX-512 one does not. Printing
        # it makes that correlation a record instead of an inference.
        run: |
          grep -m1 'model name' /proc/cpuinfo
          flags=$(grep -m1 -o 'avx512[a-z0-9_]*' /proc/cpuinfo | tr '\n' ' ')
          echo "avx512 flags: ${flags:-(none)}"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          OPENBLAS_STATIC: "1"
          # Portable static OpenBLAS needs TWO independent knobs:
          #  - DYNAMIC_ARCH=1 builds every CPU KERNEL and dispatches at runtime.
          #  - TARGET pins the COMMON/driver code (the GEMM packing helpers that
          #    `ndarray/blas` routes our matmuls through) to a baseline ISA.
          # Without TARGET, OpenBLAS compiles the common code for the build
          # RUNNER's CPU; an AVX-512 runner bakes AVX-512 into code that runs on
          # EVERY host, SIGILLing AVX2-only CPUs (the 0.11.4 wheel bug — and why
          # DYNAMIC_ARCH alone, added in 0.11.3, wasn't enough: it only fixed
          # the kernels). PRESCOTT is the x86-64 baseline (SSE2/SSE3) so common
          # code runs anywhere; dispatched kernels still hit AVX2/AVX-512.
          OPENBLAS_DYNAMIC_ARCH: "1"
          OPENBLAS_TARGET: "PRESCOTT"
          # Pin OUR Rust codegen to the x86-64 baseline too. rustc already
          # defaults to baseline, but making it explicit (a) is deterministic
          # regardless of the build runner's CPU and (b) changes the sccache
          # key, so a poisoned cached object from a native-arch build can't be
          # reused. Belt-and-suspenders against the AVX-512 leak the SDE guard
          # caught on the 0.11.8 build.
          RUSTFLAGS: "-C target-cpu=x86-64"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --no-default-features --features python,blas,blas-static
          sccache: "true"
          manylinux: auto
          before-script-linux: |
            set -e
            if command -v yum &> /dev/null; then
              yum install -y gcc-gfortran openssl-devel pkgconfig make cmake perl
            else
              apt-get update && apt-get install -y gfortran libssl-dev pkg-config make cmake perl
            fi
      - name: Validate wheel
        run: |
          python -m pip install --upgrade pip numpy pytest
          python -m pip install --no-index --find-links dist/ gamrs
          python -c "import gamrs; print('linux wheel imported OK')"
      - name: Diagnose ISA (locate any AVX-512 in the wheel .so)
        # Non-fatal evidence step: disassemble the installed extension and
        # print which symbols (if any) contain AVX-512 (zmm) instructions.
        # A Rust mangled name (_ZN5gamrs…) means our codegen leaked; an
        # OpenBLAS name (…_SKYLAKEX / dgemm_ / sgemm_…) means the BLAS common
        # or kernel code did. This tells us where the 0.11.8 leak originated
        # without guessing. Runs before the guard so it executes even when the
        # guard later fails.
        run: |
          set +e
          SO=$(python -c "import gamrs, glob, os; d=os.path.dirname(gamrs.__file__); print(glob.glob(os.path.join(d,'_gamrs_native*.so'))[0])")
          echo "SO: $SO"
          objdump -d "$SO" > /tmp/disasm.txt 2>/dev/null
          echo "=== AVX-512 (zmm) instruction count ==="
          grep -cE '%?zmm[0-9]' /tmp/disasm.txt
          echo "=== distinct owning symbols (Rust _ZN… vs OpenBLAS) ==="
          awk '/^[0-9a-f]+ <.*>:/{sym=$0} /%?zmm[0-9]/{print sym}' /tmp/disasm.txt | sort -u | head -60
          echo "=== first 20 zmm sites in context ==="
          awk '/^[0-9a-f]+ <.*>:/{sym=$0} /%?zmm[0-9]/{print sym" || "$0}' /tmp/disasm.txt | head -20
          set -e
      - uses: actions/upload-artifact@v7
        # Upload BEFORE the guard so the wheel is always retained for local
        # disassembly even when the portability guard fails.
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
      - name: Set up Intel SDE
        uses: petarpetrovt/setup-sde@v5.0
        with:
          environmentVariableName: SDE_PATH
      - name: Which kind of AVX-512 is it (dispatch vs unconditional)
        # The guard below proves an AVX-512 instruction EXECUTED under emulated
        # Haswell; it cannot say whether that was OpenBLAS's runtime dispatch
        # picking a SKYLAKEX kernel (in which case CPUID emulation is the
        # confound and real AVX2 hardware is fine) or code on the unconditional
        # path (in which case the wheel genuinely SIGILLs for those users).
        # `OPENBLAS_CORETYPE` forces the kernel choice regardless of detection,
        # so: passes here + fails below => dispatch; fails here too =>
        # unconditional, and the build must stop emitting AVX-512 at all.
        # Non-fatal and ahead of the gate so the answer is always recorded.
        continue-on-error: true
        env:
          OPENBLAS_CORETYPE: Haswell
        run: |
          set +e
          "$SDE_PATH/sde64" -hsw -- python tools/portability_check.py
          echo "coretype-forced exit: $?"
      - name: Portability guard (AVX2 emulation via Intel SDE)
        # Run a real fit under Intel SDE emulating a Haswell (AVX2-only) CPU.
        # SDE chip-check aborts on ANY instruction outside the Haswell ISA —
        # KERNEL *or* COMMON/driver code — so an AVX-512 leak (the 0.11.4 bug:
        # AVX-512 baked into OpenBLAS common code from an AVX-512 build runner)
        # fails the release here, before publish.
        #
        # The previous OPENBLAS_CORETYPE + verbose-grep guard could NOT catch
        # this: it ran on the AVX-512 build runner (where stray AVX-512 executes
        # fine) and only verified kernel DISPATCH, not the common code. The bug
        # only manifests when AVX-512-built code runs on a non-AVX-512 CPU, so
        # emulating one is the only verification — and it must run in CI because
        # the build host (where the leak originates) is itself AVX-512.
        run: |
          set -euo pipefail
          echo "SDE at: $SDE_PATH"
          "$SDE_PATH/sde64" -hsw -- python tools/portability_check.py
          echo "Portability guard OK: fit runs clean under emulated AVX2 (Haswell)."

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Two per-arch wheels, each built on its NATIVE runner, rather than one
        # universal2 fat wheel. universal2 would need a single link step to
        # produce both slices, but `blas-static` has openblas-src COMPILE
        # OpenBLAS from source for the host arch — there is no fat libopenblas
        # to lipo into, and the two arches need different portability pins
        # (OPENBLAS_TARGET=PRESCOTT vs ARMV8). Per-arch also halves what a user
        # downloads, and pip prefers an exact-arch wheel over universal2 anyway.
        include:
          - target: aarch64
            runner: macos-latest       # macos-latest is Apple Silicon
            openblas_target: ARMV8
            # aarch64-apple-darwin's rustc baseline is already the oldest Apple
            # Silicon, so there is nothing to pin down to.
            rustflags: ""
            # 11.0 is the oldest macOS that runs on Apple Silicon at all, and
            # is what this job already emitted implicitly. Stated so both arms
            # get their floor from the matrix rather than from whatever the
            # interpreter was compiled against.
            deployment_target: "11.0"
          - target: x86_64
            # macos-13 was the last Intel image on the `macos-N` line and was
            # retired on 2025-12-04; jobs asking for it do not fail, they queue
            # until they time out (run 32759779924 sat unassigned for 20+ min).
            # macos-15-intel is its replacement and is still a standard runner,
            # so it stays free on this public repo. It is scheduled to go away
            # in August 2027, which is when this wheel needs a cross-build or a
            # new home.
            runner: macos-15-intel
            openblas_target: PRESCOTT
            rustflags: "-C target-cpu=x86-64"
            # Without this the wheel's platform tag comes from the deployment
            # target the interpreter was built with, so building on a macOS 15
            # host can emit `macosx_15_0_x86_64` — a tag that excludes exactly
            # the older Intel Macs this wheel exists for. 10.13 is the floor
            # cibuildwheel uses for x86_64 and is above rustc's own 10.12
            # minimum for x86_64-apple-darwin.
            deployment_target: "10.13"
    steps:
      - uses: actions/checkout@v6
      # macos-latest (arm64) ships only CPython 3.11+ — there are no
      # darwin-arm64 builds below 3.11 to install — so the arm64 wheel set
      # starts at cp311 by necessity. The Intel image can go back to 3.9, which
      # is where linux starts, so pin the list instead of taking whatever the
      # runner image happens to preinstall.
      - name: Set up Python interpreters
        if: matrix.target == 'x86_64'
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
            3.14
      # For blas-static: openblas-src compiles from source, no brew openblas needed.
      # Only install the Fortran compiler.
      - name: Install build tools
        run: |
          set -euo pipefail
          brew install gcc  # provides gfortran
          # Installing gfortran is not enough. OpenBLAS links `-lgfortran` while building its
          # own test targets (test_sbgemv, test_bgemv), but Homebrew keeps libgfortran inside
          # the gcc formula's versioned lib dir, which is not on the linker's default search
          # path — so the link fails with `ld: library 'gfortran' not found` and openblas-src
          # panics on a non-zero make. openblas-src has no knob to skip those tests, so the
          # fix is to put the directory on the search path for every later step.
          #
          # `lib/gcc/current` is a Homebrew symlink that tracks the installed major version;
          # fall back to locating the dylib if a future layout drops it, so this does not
          # silently break again on a runner-image bump.
          gcc_lib="$(brew --prefix gcc)/lib/gcc/current"
          if [ ! -e "$gcc_lib/libgfortran.dylib" ]; then
            found="$(find "$(brew --prefix gcc)/lib/gcc" -name 'libgfortran*.dylib' -print -quit)"
            [ -n "$found" ] || { echo "libgfortran not found under $(brew --prefix gcc)/lib/gcc"; exit 1; }
            gcc_lib="$(dirname "$found")"
          fi
          echo "libgfortran dir: $gcc_lib"
          echo "LIBRARY_PATH=${gcc_lib}${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          OPENBLAS_STATIC: "1"
          # Same two-knob portability as the linux job (see its comment):
          # DYNAMIC_ARCH dispatches kernels; TARGET pins the common/driver code
          # to a baseline ISA so the build runner's own CPU can't bake a
          # newer-uarch instruction into code that must run everywhere.
          # ARMV8 is the aarch64 baseline (all Apple Silicon is ARMv8.x+);
          # PRESCOTT the x86-64 one, matching linux.
          OPENBLAS_DYNAMIC_ARCH: "1"
          OPENBLAS_TARGET: ${{ matrix.openblas_target }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --no-default-features --features python,blas,blas-static
          sccache: "true"
      - name: List built wheels, and check the tag is not a lie
        # The point of the x86_64 arm is the platform tag, so print it: a tag
        # that is not macosx_*_x86_64, or a missing interpreter, is the failure
        # this job exists to catch and it is invisible in the maturin log.
        #
        # The tag is also a CLAIM this runner cannot otherwise test. It is
        # macOS 15, so a wheel labelled macosx_10_13_x86_64 that actually links
        # against newer symbols installs and imports here perfectly, and fails
        # only on the old Mac the tag promised. MACOSX_DEPLOYMENT_TARGET feeds
        # both the filename and the Mach-O build-version load command, so
        # reading `minos` back out of the extension module proves the two agree
        # instead of trusting that the env var was honoured.
        run: |
          set -euo pipefail
          ls -l dist/
          want="${{ matrix.deployment_target }}"
          case "${{ matrix.target }}" in
            x86_64)  arch_tag=x86_64 ;;
            aarch64) arch_tag=arm64 ;;
            *) echo "no arch tag mapped for ${{ matrix.target }}"; exit 1 ;;
          esac
          tag_ver="${want//./_}"
          tmp="$(mktemp -d)"
          n=0
          for whl in dist/*.whl; do
            base="$(basename "$whl")"
            case "$base" in
              *macosx_${tag_ver}_${arch_tag}.whl) ;;
              *) echo "FAIL: $base is not tagged macosx_${tag_ver}_${arch_tag}"; exit 1 ;;
            esac
            rm -rf "${tmp:?}"/*
            unzip -q "$whl" -d "$tmp"
            so="$(find "$tmp" -name '_gamrs_native*.so' -print -quit)"
            [ -n "$so" ] || { echo "FAIL: no extension module inside $base"; exit 1; }
            # Newer linkers emit LC_BUILD_VERSION (`minos`); older ones emit
            # LC_VERSION_MIN_MACOSX (`version`). Accept either.
            minos="$(otool -l "$so" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
            if [ -z "$minos" ]; then
              minos="$(otool -l "$so" | awk '/LC_VERSION_MIN_MACOSX/{f=1} f&&/version/{print $2; exit}')"
            fi
            echo "$base -> minos ${minos:-(none)}"
            [ "$minos" = "$want" ] || { echo "FAIL: $base is tagged $want but links minos ${minos:-(none)}"; exit 1; }
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "FAIL: no wheels in dist/"; exit 1; }
          echo "$n wheel(s), all tagged macosx_${tag_ver}_${arch_tag} and all linking minos $want"
      - name: Validate wheel
        run: |
          python3 -m pip install numpy pytest
          python3 -m pip install --no-index --find-links dist/ gamrs
          python3 -c "import gamrs; print('macos wheel imported OK')"
      - uses: actions/upload-artifact@v7
        # always(): maturin builds the interpreters in one invocation, so a
        # failure on one still leaves the earlier wheels in dist/. Retain them
        # rather than losing a 20-minute build to the last interpreter.
        if: always()
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # Windows uses Intel MKL static — avoids gfortran/MSYS2.
      # intel-mkl-src downloads MKL automatically.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          target: x86_64
          args: --release --out dist --find-interpreter --no-default-features --features python,blas,blas-mkl-static
          sccache: "true"
      - name: Validate wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip numpy pytest
          python -m pip install --no-index --find-links dist/ gamrs
          python -c "import gamrs; print('windows wheel imported OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    # Only publish on a real GitHub release. `workflow_dispatch` runs build +
    # validate + portability guard so a release candidate can be smoke-tested
    # without ever pushing to PyPI (publishing a version is irreversible).
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  # ---------------------------------------------------------------------
  # crates.io publish — task #101.  ** DISABLED 2026-06-08 **
  #
  # Commented out at maintainer request: gamrs ships to PyPI only for now.
  # A crates.io publish is irreversible (the version is permanently burned)
  # and the crate name `gamrs` must first be owned on crates.io under the
  # `AlekJaworski` account. To re-enable: uncomment the job below and, once,
  # do a manual `cargo publish --dry-run` then `cargo publish` from a
  # workstation so the name is claimed before CI ever runs it.
  #
  # When live it is gated on `github.event_name == 'release'` (so
  # workflow_dispatch runs, which only build/upload wheels, don't
  # double-publish) and runs *after* every wheel + sdist + PyPI job, so a
  # publish only happens once the Python side is fully green.

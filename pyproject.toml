[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gamrs"
# Version is the single source of truth in Cargo.toml; maturin reads it from
# there via `dynamic`. Do NOT hardcode `version` here — a stale static value
# silently builds mis-versioned wheels that `--skip-existing` then drops on
# publish (the 0.11.4 release that shipped nothing).
dynamic = ["version"]
description = "Generalised additive models in Rust, with a Python API; a reimplementation of R's mgcv"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["statistics", "gam", "mgcv", "regression", "splines", "smoothing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
]

# scipy unlocks the SHASH err-param σ for `fit_quantile(preset="fast_oos")`
# (tighter τ≈0.99 OOS pinball) and is required by the `quality_oos` CV path
# (`tune_quantile_sigma`). `_shash.py` is lazy-imported with a graceful
# fallback (elf_sigma=0 heuristic — the 0.4.0 behaviour), so the base wheel
# works without it. Optional so the base wheel keeps building on Python
# versions / platforms where scipy has no wheel yet (e.g. cp314).
[project.urls]
Repository = "https://github.com/AlekJaworski/gamrs"
Changelog = "https://github.com/AlekJaworski/gamrs/blob/master/CHANGELOG.md"
Issues = "https://github.com/AlekJaworski/gamrs/issues"

[project.optional-dependencies]
quantile = ["scipy>=1.7"]

[tool.maturin]
features = ["python"]
module-name = "gamrs._gamrs_native"
python-source = "python"
manifest-path = "Cargo.toml"
# Without this, `maturin sdist` packages the entire tracked tree. None of these
# paths build or test the extension: docs/ is internal write-ups, scripts/ and
# tools/ are local harnesses carrying absolute developer paths. Keep this list
# tight — an sdist should ship what builds the wheel and what verifies it,
# nothing else. benches/ stays: Cargo.toml declares [[bench]] paths into it.
exclude = [
  "docs/**",
  "scripts/**",
  "tools/**",
  ".github/**",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Tiered suite (see tests/python/conftest.py):
#   smoke  — fast API + regression guards (sub-second)
#   parity — mgcv reference parity over all families (high coverage)
#   slow   — large-n parity fixtures, deselected by default
# Default run = smoke + parity. Full battery: pytest -m "smoke or parity or slow".
addopts = "-m 'not slow' -q"
markers = [
    "smoke: fast essential correctness + regression guards",
    "parity: numerical parity against mgcv reference fixtures",
    "slow: large-n parity fixtures (run explicitly with -m slow)",
]
